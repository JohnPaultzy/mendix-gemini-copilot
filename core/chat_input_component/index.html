<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: transparent; padding: 0; margin: 0; overflow: hidden; display: flex; justify-content: center; width: 100%; }
  
  .chat-container {
    width: 100%;
    max-width: 100%;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 8px 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    transition: border-color 0.2s;
  }
  .chat-container:focus-within {
    border-color: #38bdf8;
  }

  .thumbnails-bar {
    display: none;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid #334155;
  }
  .thumbnails-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    font-size: 11px;
    color: #94a3b8;
    font-weight: 600;
  }
  .clear-all-btn {
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 10px;
    cursor: pointer;
  }

  .thumbs-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .thumb-card {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid #38bdf8;
    background: #0f172a;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .thumb-card:hover {
    transform: scale(1.08);
    border-color: #7dd3fc;
  }
  .thumb-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .thumb-del-btn {
    position: absolute;
    top: 1px;
    right: 1px;
    background: rgba(239, 68, 68, 0.95);
    color: white;
    border: none;
    border-radius: 50%;
    width: 15px;
    height: 15px;
    font-size: 9px;
    cursor: pointer;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 10;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f8fafc;
    font-size: 14px;
    resize: none;
    line-height: 1.4;
    max-height: 100px;
    min-height: 28px;
    padding-top: 3px;
  }
  textarea::placeholder {
    color: #64748b;
  }

  .send-btn {
    background: #0284c7;
    color: white;
    border: none;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .send-btn:hover {
    background: #0369a1;
  }
</style>
</head>
<body>

<div class="chat-container" id="chat-box">
  <div class="thumbnails-bar" id="thumbs-bar">
    <div class="thumbnails-header">
      <span>📸 Attached Screenshots (<span id="img-count">0</span>) - <i>Click to view centered</i></span>
      <button class="clear-all-btn" onclick="clearAllImages(event)">Clear All ✕</button>
    </div>
    <div class="thumbs-list" id="thumbs-list"></div>
  </div>

  <div class="input-row">
    <textarea id="msg-input" placeholder="Pangutana o i-Ctrl+V ang screenshots direkta dinhi..." rows="1"></textarea>
    <button class="send-btn" id="send-btn" onclick="submitMessage()">➤</button>
  </div>
</div>

<script>
let pastedImages = [];
const msgInput = document.getElementById('msg-input');
const thumbsBar = document.getElementById('thumbs-bar');
const thumbsList = document.getElementById('thumbs-list');
const imgCount = document.getElementById('img-count');

function notifyHeight() {
  const height = Math.max(document.body.scrollHeight + 6, 52);
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: height
  }, "*");
}

function notifyReady() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
  notifyHeight();
  forcePinToBottom();
}

function sendToStreamlit(value) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: value
  }, "*");
}

// 🔒 DYNAMIC SIDEBAR-AWARE VIEWPORT PINNING (Never overlaps sidebar!)
function forcePinToBottom() {
  try {
    const parentDoc = window.parent.document;
    if (!parentDoc) return;
    const iframe = window.frameElement;
    if (iframe) {
      const container = iframe.closest('div[data-testid="stCustomComponentV1"]') || iframe.closest('div.element-container') || iframe.parentElement;
      if (container) {
        const sidebar = parentDoc.querySelector('section[data-testid="stSidebar"]');
        const isSidebarVisible = sidebar && sidebar.getBoundingClientRect().width > 50;
        const sidebarWidth = isSidebarVisible ? Math.round(sidebar.getBoundingClientRect().width) : 0;
        
        container.style.setProperty('position', 'fixed', 'important');
        container.style.setProperty('bottom', '0px', 'important');
        container.style.setProperty('left', sidebarWidth + 'px', 'important');
        container.style.setProperty('right', '0px', 'important');
        container.style.setProperty('width', `calc(100vw - ${sidebarWidth}px)`, 'important');
        container.style.setProperty('z-index', '999999', 'important');
        container.style.setProperty('background', 'linear-gradient(180deg, rgba(14,17,23,0) 0%, rgba(14,17,23,0.96) 25%, #0e1117 100%)', 'important');
        container.style.setProperty('padding', '2px 2rem 8px 2rem', 'important');
        container.style.setProperty('margin', '0', 'important');
        container.style.setProperty('box-sizing', 'border-box', 'important');
      }
    }
  } catch(e) {}
}

setInterval(forcePinToBottom, 200);

// Global Centered Screen Lightbox Modal
function openCenteredLightbox(b64) {
  const parentDoc = window.parent.document;
  if (!parentDoc) return;

  let modal = parentDoc.getElementById('mendix-global-lightbox-modal');
  if (!modal) {
    modal = parentDoc.createElement('div');
    modal.id = 'mendix-global-lightbox-modal';
    modal.style.cssText = `
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 15, 29, 0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 99999999; align-items: center; justify-content: center; flex-direction: column; padding: 20px; cursor: zoom-out;
    `;
    modal.innerHTML = `
      <div style="width: 85vw; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #cbd5e1; font-size: 13px; font-weight: 600; cursor: default;">
        <span>🔍 <b>Screenshot Preview</b> (Press <kbd>Esc</kbd> or click outside to close)</span>
        <button id="mendix-lightbox-close-btn" style="background: #ef4444; color: white; border: none; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-weight: bold;">
          Close ✕
        </button>
      </div>
      <img id="mendix-lightbox-img-element" src="" style="max-width: 85vw; max-height: 82vh; border-radius: 10px; box-shadow: 0 12px 48px rgba(0, 0, 0, 0.85); border: 2px solid #38bdf8; object-fit: contain; background: #020617; cursor: default;">
    `;
    parentDoc.body.appendChild(modal);

    modal.onclick = function() { modal.style.display = 'none'; };

    const closeBtn = parentDoc.getElementById('mendix-lightbox-close-btn');
    if (closeBtn) {
      closeBtn.onclick = function(e) {
        e.stopPropagation();
        modal.style.display = 'none';
      };
    }

    parentDoc.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') modal.style.display = 'none';
    });
  }

  const imgElem = parentDoc.getElementById('mendix-lightbox-img-element');
  if (imgElem) {
    imgElem.src = b64;
    modal.style.display = 'flex';
  }
}

msgInput.addEventListener('paste', function(e) {
  const items = (e.clipboardData || window.clipboardData).items;
  let hasImg = false;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      e.preventDefault();
      const blob = items[i].getAsFile();
      const img = new Image();
      img.src = URL.createObjectURL(blob);
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1600;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        pastedImages.push(canvas.toDataURL('image/jpeg', 0.85));
        renderThumbnails();
      };
      hasImg = true;
    }
  }
});

msgInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight) + 'px';
  notifyHeight();
});

msgInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitMessage();
  }
});

function renderThumbnails() {
  if (pastedImages.length === 0) {
    thumbsBar.style.display = 'none';
    notifyHeight();
    return;
  }

  thumbsBar.style.display = 'block';
  imgCount.innerText = pastedImages.length;
  thumbsList.innerHTML = '';

  pastedImages.forEach((b64, idx) => {
    const card = document.createElement('div');
    card.className = 'thumb-card';
    card.title = 'Click to view centered';
    card.onclick = () => openCenteredLightbox(b64);
    
    const img = document.createElement('img');
    img.src = b64;
    
    const del = document.createElement('button');
    del.className = 'thumb-del-btn';
    del.innerHTML = '✕';
    del.title = 'Remove';
    del.onclick = function(ev) {
      ev.stopPropagation();
      pastedImages.splice(idx, 1);
      renderThumbnails();
    };

    card.appendChild(img);
    card.appendChild(del);
    thumbsList.appendChild(card);
  });

  notifyHeight();
}

function clearAllImages(e) {
  if (e) e.stopPropagation();
  pastedImages = [];
  renderThumbnails();
}

function submitMessage() {
  const text = msgInput.value.trim();
  if (!text && pastedImages.length === 0) return;

  const payload = {
    text: text,
    images: [...pastedImages],
    timestamp: Date.now()
  };

  sendToStreamlit(payload);

  msgInput.value = '';
  msgInput.style.height = 'auto';
  pastedImages = [];
  renderThumbnails();
  notifyHeight();
}

window.addEventListener('load', notifyReady);
document.addEventListener('DOMContentLoaded', notifyReady);
setTimeout(notifyReady, 50);
setTimeout(notifyReady, 300);
</script>
</body>
</html>
